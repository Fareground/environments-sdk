[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fg-env"
version = "0.8.0"
description = "The Environments SDK for AI agents: define an environment as one JSON contract, the engine runs it."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agents", "environments", "llm", "simulation", "multi-agent", "sdk", "contract", "ai"]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Simulation",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "pytest-cov>=5.0", "ruff==0.16.1", "mypy>=1.10", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/Fareground/environments-sdk"
Repository = "https://github.com/Fareground/environments-sdk"
Documentation = "https://fareground.com/docs/env-kernel/"
Changelog = "https://github.com/Fareground/environments-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/Fareground/environments-sdk/issues"

[project.scripts]
fg-env = "fg_env.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fg_env"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Conservative ruleset for now; tighten over time. Run `ruff check --statistics .` to see what's noisy.
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # line-too-long — many long expression strings
    "E731",  # lambda assignments — used intentionally
    "E741",  # ambiguous names (l, I, O) — present in math-heavy code
    "E702",  # multiple statements on one line (semicolon)
    "B018",  # a bare `wake.brief` / `wake.update` is a read the run records, not a useless expression
    "B905",  # zip() without strict= — adopting strict zips is its own sweep
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["fg_env"]

[tool.mypy]
plugins = ["pydantic.mypy"]
# The package ships py.typed, so CI must actually type-check it. Not fully strict yet: tighten flags over time.
files = ["src/fg_env"]
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# These look up untyped event/entity data by a key that may be missing (`table.get(data.get("k"))`); making each
# lookup explicit is left for a focused change.
module = ["fg_env.host.stubs", "fg_env.mechanisms.cards", "fg_env.perception", "fg_env.world"]
strict_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# A serializer warning means a contract field holds a value its type does not expect: fail instead of warning.
filterwarnings = ["error:Pydantic serializer warnings:UserWarning"]

[tool.coverage.report]
# CI measures coverage on the newest Python and fails below this floor (just under the current total). Raise it as
# coverage rises; never lower it to let a change through.
fail_under = 91
