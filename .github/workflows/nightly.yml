name: Nightly

# What is too slow for every pull request: the slow verification tests, and the suite on the lowest supported
# dependencies.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests with the slow verification on (thousands of fuzz seeds, crowd scaling, flagship bounds)
        env:
          FG_ENV_SLOW: "1"
        run: pytest -q -n auto

  # The oldest Python with the oldest pydantic that pyproject.toml allows.
  lowest-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" "pydantic==2.0.*"  # keep in step with the pydantic floor in pyproject.toml
      - run: pytest -q -n auto
