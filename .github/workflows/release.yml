name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Publishes the tagged commit as it is: nothing here runs the tests. Run the release checks on that commit first:
# `make gate` and `make test-slow` (see CONTRIBUTING.md).
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match pyproject version $PKG_VERSION" >&2
            exit 1
          fi
      - name: Build
        run: python -m pip install build && python -m build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
